//返回的信息   

syntax = "proto3";//指定proto使用proto3语法  
import "RequestEntity.proto";//引用请求侧消息定义（TaskProgressData 等）

//信息码   
enum CmdCode{
  Succeed = 0;//请求成功  
  AcctExist = 1;//账号已存在  
  ServerError = 2;//服务端错误 
  AcctNotExist = 3;//账号不存在  
  PasswordError = 4;//密码错误 
  AcctDisable = 5;//账号禁用   
  ReqParamError = 6;//请求参数错误 
  NicknameExist = 7;//昵称已存在 
  UserNameIlegal = 8;//用户名不合法 
  passwordIlegal = 10;//密码不合法 
  RoleNotExist = 11;//角色不存在
  EnemyNotExist = 12;//敌人不存在
}
message ErrMsg{
  CmdCode cmd_code = 1;//错误码  
}
message RegistRet{
  CmdCode cmd_code = 1;//表示注册是否成功  
}

message loginRet{
  CmdCode cmd_code = 1;//登录是否成功   信息码 记录登录的状态  
  GameServer game_server = 2;//表示最后登录服务器的id  
  int32 account_id = 3;//用户id  
}


message GameServer{//游戏服   每个游戏服的信息 
  int32  server_id = 1;//服务器id 
  string server_name = 2;//名称 
  int32 run_state = 3;//运行状态 
  int32 is_new = 4;//是否是新服  
  string ip_host = 5;//ip
  int32 port = 6;//端口 

}
//获取服务器列表返回数据 
message GetServerListRet{
  CmdCode cmd_code = 1;//表示请求是否成功  
  repeated GameServer game_servers = 2;//protobuf中定义数组的方式  中间GameServer表示数组里面存的数据类型 
}
//获取登录服务器返回的数据
message loginGameServerRet{
  CmdCode cmd_code = 1;//表示请求是否成功   信息码  记录返回的结果  
  CreateRoleRet create_role_info = 2;//已创建的角色信息    
}
//创建角色返回数据 
message CreateRoleRet{
  CmdCode cmd_code = 1;//表示创建角色是否成功  
  int32 role_id = 2;//角色id  
  string nickname = 3;//昵称 
  int32 job_id = 4;
  int32 level = 5;
}

//保存角色数据返回
message SaveRoleRet{
  CmdCode cmd_code = 1;
}
//跳转场景返回
message ChangeSceneRet{
  CmdCode cmd_code = 1;
}
//生成敌人返回
message SpawnEnemyRet{
  CmdCode cmd_code = 1;
  int32 enemy_instance_id = 2; // 服务端分配的敌人实例ID
  float pos_x = 3;             // 出生位置X
  float pos_y = 4;             // 出生位置Y
  float pos_z = 5;             // 出生位置Z
  float max_hp = 6;            // 最大血量
  float curr_hp = 7;           // 当前血量
  int32 enemy_config_id = 8;   // 敌人配置表ID
}

// 玩家攻击返回
message PlayerAttackRet{
  CmdCode cmd_code = 1;
  int32 enemy_instance_id = 2;
  float damage_dealt = 3;       // 实际造成的伤害
  float enemy_curr_hp = 4;      // 敌人当前血量
  float enemy_max_hp = 5;       // 敌人最大血量
  bool is_dead = 6;             // 敌人是否死亡
  bool is_baoji = 7;            // 是否暴击
  int32 attacker_role_id = 8;   // 攻击者的角色ID（客户端用于区分是自己打还是别人打）
}
//获取奖励返回
message GetRewardRet{
  CmdCode cmd_code = 1;
  map<int32,int32> reward_map = 2;// 本次实际发放的奖励 id→数量（物品编号见 ItemCatalog）
  string reward_desc = 3;         // 服务端组好的奖励文本，客户端直接弹提示
}
//驱动盘升级返回
message DriverDiskUpgradeRet{
  CmdCode cmd_code = 1;
  DriverDiskInfo driver_disk = 2;     // 升级后的驱动盘状态（等级 / 经验 / 词条），客户端据此覆盖本地实例
  map<int32,int32> material_map = 3;  // 本次受影响材料的剩余数量（id→剩余），客户端据此覆盖显示
  int32 old_level = 4;                // 升级前等级，客户端据此判断是否首次升到 2 级以推进任务
  string tip = 5;                     // 失败提示（材料不足等），成功时为空
}
//装备 / 卸下驱动盘返回
message DriverDiskEquipRet{
  CmdCode cmd_code = 1;
  int32 depot_id = 2;                 // 驱动盘模板 id
  bool equipped = 3;                  // 操作后的装备状态
  string tip = 4;                     // 失败提示（装备槽已满等），成功时为空
}
//背包信息（服务端 → 客户端）。进入游戏 / 领奖后拉取，物品模板仍在 Luban，这里只有「拥有 + 穿戴 + 升级进度」
message BagInfoRet{
  CmdCode cmd_code = 1;
  map<int32, DriverDiskInfo> driver_disk_map = 2;
  map<int32, MaterialInfo> material_map = 3;
}
//开始游戏请求返回数据
message StartGameRet{
  CmdCode cmd_code = 1;//表示请求是否成功  
  //角色的所有属性信息，角色有很多类型，主角、其他玩家、NPC、怪物等 
  MainRoleInfo main_role_info = 2;//主角信息
}
//角色基础信息 
message RoleBaseInfo{
  int32 role_id = 1;
  string nickname = 2;
}
//主角信息
message MainRoleInfo{
  RoleBaseInfo base_info = 1;
  int32 account_id = 2;//账号id 
  string scene_name = 7;//所处场景名称
  int32 server_id = 8;//所处服务器id
  // 背包物品字典
  map<int32, DriverDiskInfo> driver_disk_map = 9;
  map<int32, MaterialInfo> material_map = 10;
}
message DriverDiskInfo{
  int32 id = 1;                 // 数据库自增 id
  int32 driver_disk_id = 2;     // 驱动盘模板 id
  int32 driver_disk_count = 3;  // 驱动盘数量
  string driver_disk_name = 4;  // 驱动盘名称
  int32 base_value = 5;          // 驱动盘的初始加成
  float attack_per = 6;      // 加成比率
  float defense_per = 7;
  float health_per = 8;
  float baoJi_per = 9;
  int32 level = 10;
  float cur_max_fill_value = 11;
  float cur_fill_value = 12;
  bool is_equipped = 13;         // 是否已装备（服务端 role_bag_item.IsEquipped）
}
message MaterialInfo{
  int32 material_id = 1;        // 拥有材料 id
  int32 material_count = 2;     // 拥有材料数量
  string material_name = 3;     // 材料名称
}

// 位置同步广播（服务端→其他客户端）
message PositionSyncNtf{
  int32 role_id = 1;
  float pos_x = 2;
  float pos_y = 3;
  float pos_z = 4;
  float rotation_y = 5;
  string nike_name = 6;
}

// 玩家进入场景通知
message PlayerEnterSceneNtf{
  int32 role_id = 1;
  string nickname = 2;
  float pos_x = 3;
  float pos_y = 4;
  float pos_z = 5;
  int32 scene_name = 6;
}

// 玩家离开场景通知
message PlayerLeaveSceneNtf{
  int32 role_id = 1;
}

// ========== 房间系统 ==========

// 房间内玩家信息
message RoomPlayerInfo{
  int32 role_id = 1;
  string nickname = 2;
  bool is_master = 3;    // 是否房主
  bool is_ready = 4;     // 是否已准备
}

// 创建房间返回
message CreateRoomRet{
  CmdCode cmd_code = 1;
  int32 room_id = 2;
  repeated RoomPlayerInfo players = 3;
}

// 加入房间返回
message JoinRoomRet{
  CmdCode cmd_code = 1;
  int32 room_id = 2;
  repeated RoomPlayerInfo players = 3;
}

// 房间信息变更通知（广播给房间内所有人）
message RoomInfoNtf{
  int32 room_id = 1;
  repeated RoomPlayerInfo players = 2;
}

// 房主开始游戏通知（广播：所有人都加载GameScene）
message RoomStartGameNtf{
  int32 room_id = 1;
  int32 map_id = 2;
}

// 房间摘要（房间列表项）
message RoomSummary{
  int32 room_id = 1;
  string room_name = 2;
  int32 master_role_id = 3;     // 房主角色 id
  string master_nickname = 4;   // 房主昵称
  int32 player_count = 5;       // 当前人数
  int32 max_player = 6;         // 人数上限
  int32 state = 7;              // 0=等待中 1=游戏中
}

// 房间列表回包
message RoomListRet{
  CmdCode cmd_code = 1;
  repeated RoomSummary rooms = 2;
}

// 离开房间回包（离开成功后客户端关闭房间界面）
message LeaveRoomRet{
  CmdCode cmd_code = 1;
  string tip = 2;
}

// 房间内聊天消息
message RoomChatMsg{
  int32 sender_role_id = 1;
  string sender_nickname = 2;
  string content = 3;
  string send_time = 4;
}

// 房间聊天广播（服务端 → 房间内所有人，含发送者自己）
message RoomChatNtf{
  int32 room_id = 1;
  RoomChatMsg message = 2;
}

message SyncAniRet{
  string animation_name = 1;
  int32 role_id = 2;
  int32 skill_config_index = 3;
}

message PlayerVfxNtf{
  int32 role_id = 1;
  int32 skill_config_index = 2;
  int32 attack_index = 3;
  int32 vfx_index = 4;
}

// 敌人位置同步（服务端 → 客户端）。敌人不再有「归属玩家」，因此用服务端实例ID定位。
message EnemyPositionSyncRet{
  int32 enemy_instance_id = 1;  // 服务端分配的敌人实例ID
  float pos_x = 2;              // 服务端权威位置X
  float pos_y = 3;
  float pos_z = 4;
  float rotation_y = 5;         // 服务端权威朝向（绕Y轴角度）
}
// 敌人动作/状态同步（服务端 → 客户端）。服务端决定播哪个动作，客户端只负责演。
message EnemySyncAniRet{
  string animation_name = 1;    // 服务端指定的动作名（Idle / Attack05Run / Attack01..04 / Dead）
  int32 enemy_instance_id = 2;
  int32 state = 3;              // 对应客户端 EnemyStateType：0=Idle 1=Attack 2=Hurt 3=Dead
}

// ========== 任务进度持久化 ==========

// 上报任务进度回包
message TaskProgressRet{
  CmdCode cmd_code = 1;
}

// 拉取全量任务回包：任务定义由服务端 Luban 权威下发 + 该角色的进度，客户端不再有本地任务配置
message TaskProgressListRet{
  CmdCode cmd_code = 1;
  repeated TaskInfo task_list = 2; // 该角色全部任务（定义 + 进度，TaskInfo 定义在 RequestEntity.proto）
}

// ========== 玩家受击（敌人攻击玩家，服务端权威） ==========

// 玩家受击广播（服务端 → 客户端）：敌人攻击命中玩家的唯一结算来源。
// 客户端收到后只覆盖血量并播受击表现，不再自行做命中判定与扣血。
// 广播范围是场景内所有人（含被打者自己），被打者据此更新血条 / 切受击死亡状态。
message PlayerHurtNtf{
  int32 role_id = 1;             // 被打的玩家
  int32 enemy_instance_id = 2;   // 发起攻击的敌人实例（客户端据此取本地受击表现参数）
  float damage = 3;              // 本次实际伤害（服务端已扣减防御）
  float curr_hp = 4;             // 结算后的当前血量
  float max_hp = 5;              // 血量上限
  bool is_dead = 6;              // 本次是否致死
}

// ========== 好友系统 ==========

// 好友信息（好友列表项）
message FriendInfo{
  int32 role_id = 1;      // 好友的角色 id
  string nickname = 2;    // 好友昵称
  bool is_online = 3;     // 是否在线（由 LoginServer 在线状态填充）
}

// 拉取好友列表回包
message FriendListRet{
  CmdCode cmd_code = 1;
  repeated FriendInfo friends = 2;
  repeated FriendInfo applies = 3;  // 别人向我发起、我尚未处理的申请（role_id/nickname 都是申请者）
}

// 添加好友回包
message AddFriendRet{
  CmdCode cmd_code = 1;
  string tip = 2;         // 失败提示（对方不存在 / 已是好友 / 重复申请等），成功为空
  int32 from_role_id = 3; // 申请者角色 id（成功时填充，供 LoginServer 实时推送）
  int32 to_role_id = 4;   // 被申请者角色 id（同上）
  string from_nickname = 5; // 申请者昵称（推送通知展示用）
  string to_nickname = 6; // 被申请者昵称
}

// 处理好友申请回包
message HandleFriendRet{
  CmdCode cmd_code = 1;
  string tip = 2;
}

// 好友申请实时通知（服务端 → 被申请者）。被申请者在线时实时推送，用于刷新申请列表 / 弹提示。
message FriendApplyNtf{
  int32 from_role_id = 1;    // 申请者
  string from_nickname = 2;  // 申请者昵称
}

// ========== 好友私聊 ==========

// 单条私聊消息
message FriendMsg{
  int32 id = 1;               // 数据库自增 id（客户端据此去重 / 排序）
  int32 sender_role_id = 2;   // 发送者
  int32 receiver_role_id = 3; // 接收者
  string content = 4;         // 消息内容
  string send_time = 5;       // 发送时间（"HH:mm:ss" 或完整时间，由服务端格式化）
}

// 发送私聊回包（服务端落库后回给发送者，带完整消息信息与自增 id）
message SendFriendMsgRet{
  CmdCode cmd_code = 1;
  FriendMsg message = 2;
}

// 拉取聊天记录回包（按时间升序，最多 100 条）
message FriendHistoryRet{
  CmdCode cmd_code = 1;
  repeated FriendMsg messages = 2;
}

// 私聊消息实时推送（服务端 → 接收者）。接收者在线时实时推送，离线则等下次拉历史时看到。
message FriendMsgPushNtf{
  FriendMsg message = 1;
}



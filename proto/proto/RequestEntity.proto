//跳转场景请求
message ChangeSceneReq{
  int32 role_id = 1;
  string scene_name = 2;
}

//请求生成敌人
message SpawnEnemyReq{
  int32 role_id = 1;
  int32 trigger_type = 2; //触发类型: 1=对话结束 2=完成任务 3=进入区域
  int32 trigger_id = 3;   //对应的对话/任务/区域id
  int32 enemy_config_id = 4; // 敌人配置表ID（Luban）
  float max_hp = 5;
  float pos_x = 6;
  float pos_y = 7;
  float pos_z = 8;
}

// 玩家攻击请求
message PlayerAttackReq{
  int32 role_id = 1;
  int32 enemy_instance_id = 2; // 服务端分配的敌人实例ID
  float damage = 4;            // 客户端计算的伤害
  float baoji_percent = 5;     // 暴击率
  bool is_ex_attack = 6;       // 是否EX攻击
  int32 sequence_id = 7;       // 客户端递增序列号，用于回包匹配
}

//获取奖励请求
message GetRewardReq{
  int32 role_id = 1;
  int32 reward_type = 2;  //奖励类型: 1=任务奖励 2=击杀奖励 3=拾取物品
  int32 task_id = 3;      //任务奖励时必填：服务端据此从 Luban 配置取该任务的奖励内容
}

// 驱动盘升级请求（服务端权威：校验材料 → 扣除 → 加经验升级 → 写 role_bag_item）
message DriverDiskUpgradeReq{
  int32 role_id = 1;
  int32 depot_id = 2;     // 驱动盘模板 id（对应 role_bag_item.ItemId）
}

// 装备 / 卸下驱动盘请求（服务端写 role_bag_item.IsEquipped）
message DriverDiskEquipReq{
  int32 role_id = 1;
  int32 depot_id = 2;     // 驱动盘模板 id
  bool equip = 3;         // true=装备 false=卸下
}

// 背包信息拉取请求（进入游戏 / 领奖后刷新本地背包）
message BagInfoReq{
  int32 role_id = 1;
}

//开始游戏请求
message StartGameReq{
  int32 role_id = 1;//角色id
}

//打开对话请求
message OpenDialogueReq{
  int32 role_id = 1;//角色id
}

// 位置同步请求（客户端→服务端，每100ms发一次，仅GameScene）
message PositionSyncReq{
  int32 role_id = 1;
  float pos_x = 2;
  float pos_y = 3;
  float pos_z = 4;
  float rotation_y = 5;
  string nike_name = 6;
}

// 创建房间请求
message CreateRoomReq{
  int32 role_id = 1;
  string room_name = 2;
  string nickname = 3;
  int32 avatar = 4;      // 头像编号（房间列表 / 房内成员展示用）
}

// 加入房间请求
message JoinRoomReq{
  int32 role_id = 1;
  int32 room_id = 2;
  string nickname = 3;
  int32 avatar = 4;
}

// 离开房间请求
message LeaveRoomReq{
  int32 role_id = 1;
}

// 房主踢人请求（服务端校验：只有房主能踢、只能踢同房间的人、不能踢自己）
message KickPlayerReq{
  int32 role_id = 1;        // 操作者（房主）
  int32 target_role_id = 2; // 被踢者
}

// 房主开始游戏请求
message RoomStartGameReq{
  int32 role_id = 1;
}

// 玩家准备状态切换请求
message PlayerReadyReq{
  int32 role_id = 1;
  bool is_ready = 2;
}

// 拉取房间列表请求（由 LoginServer 从内存直接返回）
message RoomListReq{
  int32 role_id = 1;
}

// 房间内聊天请求（服务端补上昵称与时间后广播给房间内所有人）
message RoomChatReq{
  int32 role_id = 1;
  string content = 2;
}

message SyncAniReq{
  int32 role_id = 1;
  string animation_name = 2;
  int32 skill_config_index = 3;
}

// 敌人同步说明：敌人的位置与动作改由服务端权威下发（见 ResultEntity.proto 的
// EnemyPositionSyncRet / EnemySyncAniRet），客户端不再上报敌人数据，故此处已无对应请求。
// 服务端生成敌人仍走 SpawnEnemyReq。

// ========== 任务进度持久化 ==========

// 单条任务进度（客户端 → 服务端上报用，只带可变状态）
message TaskProgressData{
  int32 task_id = 1;        // 任务唯一 id（对应服务端 Luban taskData.TaskID）
  int32 state = 2;          // 任务状态：0=Locked 1=InProgress 2=Completed 3=Claimed（对应 TaskState 枚举）
  int32 current_count = 3;  // 当前进度
}

// 任务完整数据（服务端 → 客户端下发）：定义来自 Luban，进度来自 role_task_progress。
// 客户端不再维护任何本地任务配置，任务描述 / 类型 / 目标数量 / 奖励全部以本消息为准。
message TaskInfo{
  int32 task_id = 1;              // 任务唯一 id
  string task_desc = 2;           // 任务描述（UI 展示）
  int32 task_type = 3;            // 任务类型（对应 TaskType 枚举：0=击败第一个敌人 1=给每一个驱动盘都升一级）
  int32 target_count = 4;         // 目标数量
  repeated int32 depot_ids = 5;   // 驱动盘奖励 id 列表（用服务端物品编号，见 ItemCatalog）
  repeated int32 materials_id = 6;// 材料奖励 id 列表（同上）
  int32 state = 7;                // 任务状态：0=Locked 1=InProgress 2=Completed 3=Claimed
  int32 current_count = 8;        // 当前进度
}

// 上报任务进度请求（状态迁移 / 进度变化时客户端主动上报）
message TaskProgressNtf{
  int32 role_id = 1;
  repeated TaskProgressData progress_list = 2; // 本次变化的进度集合（支持批量）
}

// 拉取全量任务进度请求（登录 / 进入游戏时）
message TaskProgressReq{
  int32 role_id = 1;
}

// ========== 玩家战斗属性上报 ==========

// 玩家战斗属性上报（客户端 → 服务端）：属性由客户端按「基础值 + 已装备驱动盘加成」算出，
// 服务端需要同一份数值才能做敌人攻击的伤害结算（扣防御）与血量上限。
// 进游戏时上报一次，之后每次属性重算（换装 / 升级）再上报一次，覆盖式生效。
message PlayerStatsNtf{
  int32 role_id = 1;
  float max_hp = 2;    // 血量上限
  float defense = 3;   // 防御值（服务端按 defense / 10 减伤）
}

// ========== 好友系统 ==========

// 拉取好友列表请求
message FriendListReq{
  int32 role_id = 1;
}

// 添加好友请求（from 向 to 发起申请）
message AddFriendReq{
  int32 from_role_id = 1;
  int32 to_role_id = 2;
}

// 处理好友申请请求（同意 / 拒绝）
message HandleFriendReq{
  int32 role_id = 1;        // 处理者（即申请里的 to_role_id）
  int32 target_role_id = 2; // 申请者（即申请里的 from_role_id）
  bool accept = 3;          // true=同意 false=拒绝
}

// ========== 好友私聊 ==========

// 发送私聊消息请求
message SendFriendMsgReq{
  int32 sender_role_id = 1;
  int32 receiver_role_id = 2;
  string content = 3;
}

// 拉取与某好友的最近聊天记录请求（服务端最多返回 100 条）
message FriendHistoryReq{
  int32 role_id = 1;
  int32 friend_role_id = 2;
}

// 标记与某好友的私聊已读（打开聊天 / 聊天窗口里收到新消息时补发，服务端把对方发来的未读全部置已读）
message MarkFriendMsgReadReq{
  int32 role_id = 1;        // 接收者（我）
  int32 friend_role_id = 2; // 对方
}
// ========== 头像 ==========

// 设置头像请求
message SetAvatarReq{
  int32 role_id = 1;
  int32 avatar = 2;      // 头像编号（客户端 AvatarConfig 的下标，0=默认）
}
